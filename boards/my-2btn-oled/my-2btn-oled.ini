[env:my-2btn-oled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.variants_dir = boards

; --- Память для ESP32-S3 N16R8 ---
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_src_filter = ${env.build_src_filter} +<../boards/my-2btn-oled>

lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX@^1.2.0

lib_ignore =
    TFT_eSPI

build_flags =
    ${env.build_flags}
    -DSTATUS_BAR_HEIGHT=2
    -DDEVICE_NAME='"My2BtnOLED"'
    -DMY_2BTN_OLED
    -Iboards/my-2btn-oled
    -DCORE_DEBUG_LEVEL=1
    -Os
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; --- Дисплей (LovyanGFX, SPI SSD1309) ---
    -DHAS_SCREEN=1
    -DUSE_LOVYANGFX=1
    -DLOVYAN_PANEL=Panel_SSD1306
    -DLOVYAN_BUS=Bus_SPI
    -DLOVYAN_SPI_BUS=1

    ; --- SPI настройки шины ---
    -DTFT_SPI_HOST=SPI2_HOST
    -DTFT_SPI_MODE=0
    -DTFT_WRITE_FREQ=8000000
    -DTFT_READ_FREQ=4000000
    -DTFT_SPI_3WIRE=1
    -DTFT_USE_LOCK=1

    ; --- Пины OLED ---
    -DTFT_SCLK=14
    -DTFT_MOSI=15
    -DTFT_MISO=-1
    -DTFT_DC=17
    -DTFT_CS=18
    -DTFT_RST=16
    -DTFT_BUSY_PIN=-1

    ; --- Параметры панели ---
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=64
    -DTFT_OFFSET_X=0
    -DTFT_OFFSET_Y=0
    -DTFT_INVERTION=1
    -DTFT_RGB_ORDER=0
    -DTFT_MEM_WIDTH=128
    -DTFT_MEM_HEIGHT=64
    -DTFT_BL=-1
    -DBACKLIGHT=-1
    -DMINBRIGHT=0
    -DROTATION=0
    -DSMOOTH_FONT=0
    -DTFT_MONOCHROME=1
    -DUI_COMPACT=1

    ; --- Кнопки (GPIO 4 и 5) ---
    -DHAS_BTN=1
    -DUP_BTN=4
    -DDW_BTN=5
    -DSEL_BTN=5
    -DBTN_ACT=LOW

    ; --- CC1101 (433 МГц) ---
    -DUSE_CC1101_VIA_SPI
    -DCC1101_SS_PIN=10
    -DCC1101_GDO0_PIN=9
    -DCC1101_SCK_PIN=13
    -DCC1101_MISO_PIN=11
    -DCC1101_MOSI_PIN=12

    ; --- Отключаем неиспользуемое ---
    -DDISABLE_GPS
    -DDISABLE_LORA
    -DDISABLE_ETHERNET
    -DDISABLE_FM
    -DDISABLE_SD
    -DDISABLE_IR
    -DDISABLE_NRF24
    -DDISABLE_PN532
